<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38a8e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Wings">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Admin and classes dashboard for The Little Wings Play School, Vuyyuru">
<title>The Little Wings · Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="style.css?v=2.8.0">
<link rel="stylesheet" href="assets/receipt.css?v=2.8.0">
</head>
<body>
<noscript><div class="noscript">This dashboard needs JavaScript turned on in your browser.</div></noscript>

<!-- Sign-in / first admin setup -->
<div id="auth-screen" hidden></div>

<!-- Main app shell -->
<div id="shell" hidden>
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Dashboard home">
      <img src="assets/logo.jpeg" alt="" width="40" height="40">
      <span class="brand-text"><b id="brand-name">The Little Wings</b><small id="page-title">Dashboard</small></span>
    </a>
    <div class="top-actions">
      <button type="button" id="sync-badge" class="sync-badge syncing" data-act="sync-retry" title="Connecting"><i></i><span>Connecting…</span></button>
      <select id="lang-sel" class="lang-sel" data-change="lang" aria-label="Language / భాష / भाषा"><option value="en">EN</option><option value="te">తె</option><option value="hi">हि</option></select>
      <span id="user-chip" class="user-chip"></span>
      <button class="btn ghost small" data-act="logout" title="Sign out">🚪 <span class="hide-xs">Sign out</span></button>
    </div>
  </header>
  <nav id="sidenav" class="sidenav" aria-label="Main"></nav>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="bottomnav" class="bottomnav" aria-label="Main"></nav>
</div>

<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>

<button type="button" id="sw-update" hidden>New version available — tap to refresh</button>

<script src="config.js?v=2.8.0"></script>
<script src="assets/vendor/supabase-js-2.119.0.js"></script>
<script src="assets/receipt.js?v=2.8.0"></script>
<script src="assets/xlsx-lite.js?v=2.8.0"></script>
<script src="app.js?v=2.8.0"></script>
</body>
</html>
